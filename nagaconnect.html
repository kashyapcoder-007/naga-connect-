  <!-- Leaflet 1.9.4 core CSS (marker sprites inlined as data URIs) -->
  <style>/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,
.leaflet-layer {
	position: absolute;
	left: 0;
	top: 0;
	}
.leaflet-container {
	overflow: hidden;
	}
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow {
	-webkit-user-select: none;
	   -moz-user-select: none;
	        user-select: none;
	  -webkit-user-drag: none;
	}
/* Prevents IE11 from highlighting tiles in blue */
.leaflet-tile::selection {
	background: transparent;
}
/* Safari renders non-retina tile on retina better with this, but Chrome is worse */
.leaflet-safari .leaflet-tile {
	image-rendering: -webkit-optimize-contrast;
	}
/* hack that prevents hw layers "stretching" when loading new tiles */
.leaflet-safari .leaflet-tile-container {

    html:not(.dark) .glass-panel {
      background: rgba(255, 255, 255, 0.90);
      border: 1px solid rgba(200, 16, 46, 0.15);
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.08);
    }

    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 15px rgba(200, 16, 46, 0.40); }
      50%      { box-shadow: 0 0 28px rgba(245, 158, 11, 0.70); }
    }
    .animate-glow { animation: pulseGlow 3s infinite; }

    @keyframes floatSlow {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-6px); }
    }
    .animate-float { animation: floatSlow 4s ease-in-out infinite; }

    /* Leaflet: keep the container transparent so the offline grid shows through
       whenever map tiles can't load, and match the app's card radius. */
    .leaflet-container {
      font-family: inherit;
      border-radius: 0.75rem;
      z-index: 10;
      background: transparent;
    }
    .leaflet-container a { color: #C8102E; }
    .leaflet-popup-content { font-size: 12px; margin: 8px 10px; }
    .leaflet-control-zoom a {
      background: #151C28; color: #fff; border-color: #334155;
    }
    .leaflet-control-zoom a:hover { background: #C8102E; color: #fff; }

    @media print {
      header, footer, nav { display: none !important; }
    }
  </style>

/* --------------------------------------------------------------------------
   SAFE STORAGE — sandboxed iframes (sandbox="allow-scripts") run in an opaque
   origin where calling localStorage/indexedDB throws a SecurityError. Every
   access goes through these wrappers so the app never crashes on boot.
   -------------------------------------------------------------------------- */
const MEM_STORE = {};
const storageGet = (key, fallback) => {
  try {
    const raw = window.localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch (err) {
    return Object.prototype.hasOwnProperty.call(MEM_STORE, key) ? MEM_STORE[key] : fallback;
  }
};
const storageSet = (key, value) => {
  MEM_STORE[key] = value;
  try {
    window.localStorage.setItem(key, JSON.stringify(value));
  } catch (err) {
    /* memory-only fallback */
  }
};
const syncToIndexedDB = (storeName, data) => {
  try {
    storageSet("nagaconnect_" + storeName, data);
    if (!("indexedDB" in window)) return;
    const req = window.indexedDB.open("NagaConnectOfflineDB", 1);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains("news")) db.createObjectStore("news", {
        keyPath: "id"
      });
      if (!db.objectStoreNames.contains("bookings")) db.createObjectStore("bookings", {
        keyPath: "bookingId"
      });
    };
    req.onerror = () => {};
    req.onsuccess = e => {
      try {
        const db = e.target.result;
        if (!db.objectStoreNames.contains(storeName)) return;
        const tx = db.transaction(storeName, "readwrite");
        const store = tx.objectStore(storeName);
        if (Array.isArray(data)) data.forEach(item => store.put(item));
      } catch (err) {
        /* ignore — localStorage mirror is the source of truth */
      }
    };
  } catch (err) {
    /* opaque origin: silent fallback */
  }
};

  const [openWeatherKey, setOpenWeatherKey] = useState("");

  useEffect(() => {

    syncToIndexedDB("news", newsList);
  }, [newsList]);
  useEffect(() => {
    const goOnline = () => setIsOnline(true);
    const goOffline = () => setIsOnline(false);
    window.addEventListener("online", goOnline);
    window.addEventListener("offline", goOffline);
    return () => {
      window.removeEventListener("online", goOnline);
      window.removeEventListener("offline", goOffline);
    };
  }, []);

  /* ---- speech synthesis ---- */
  const speakText = useCallback(textToSpeak => {
    try {
      if (!("speechSynthesis" in window)) {
        setVoiceStatus("Speech synthesis is not available in this browser/embed.");
        return;
      }
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(textToSpeak);
      utterance.lang = lang === "hi" ? "hi-IN" : "en-IN";
      utterance.rate = 0.95;
      window.speechSynthesis.speak(utterance);

      setVoiceStatus("Voice output blocked here — open the file directly in a browser tab.");

  const openBooking = subView => {

  const openTaxi = type => {
    if (type) setSelectedTaxiType(type);

    setBookingSubView("selected_taxi");
  };
  const openNews = () => setCurrentView("news");
  const openTourism = () => setCurrentView("tourism");

  /* ---- voice command assistant ---- */
  const toggleVoiceCommands = () => {
    const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;

      setVoiceStatus("Voice recognition isn't supported in this browser. Try Chrome or Edge.");
      return;
    }
    if (isListening) {
      setIsListening(false);
      setVoiceStatus("");
      return;
    }
    try {
      const recognition = new Recognition();
      recognition.lang = "en-IN";
      recognition.interimResults = false;
      setIsListening(true);
      setVoiceStatus('Listening… try "Book Taxi", "State Bus", "Offline News" or "Tourism"');
      recognition.onresult = event => {
        const transcript = String(event.results[0][0].transcript || "").toLowerCase();
        setVoiceStatus('Heard: "' + transcript + '"');
        setIsListening(false);
        if (transcript.indexOf("taxi") > -1 || transcript.indexOf("bike") > -1 || transcript.indexOf("cab") > -1) {
          openTaxi("four");
          speakText("Opening local taxi booking interface.");
        } else if (transcript.indexOf("bus") > -1) {
          openBooking("bus_schedule");
          speakText("Opening Nagaland State bus timing and seat selector.");
        } else if (transcript.indexOf("train") > -1) {
          openBooking("train_portal");
          speakText("Opening IRCTC train booking routes.");
        } else if (transcript.indexOf("flight") > -1 || transcript.indexOf("airport") > -1) {
          openBooking("flight_portal");
          speakText("Opening IRCTC flight booking options.");
        } else if (transcript.indexOf("news") > -1 || transcript.indexOf("offline") > -1) {
          openNews();
          speakText("Opening offline Nagaland state news.");
        } else if (transcript.indexOf("tourism") > -1 || transcript.indexOf("place") > -1 || transcript.indexOf("dzukou") > -1) {
          openTourism();
          speakText("Opening Nagaland tourism spots and homestays.");
        } else if (transcript.indexOf("nagamese") > -1) {
          setLang("nag");
          speakText("Switched language to Nagamese.");
        } else if (transcript.indexOf("dashboard") > -1 || transcript.indexOf("hub") > -1) {
          openDashboard();
          speakText("Opening the central hub.");
        }
      };
      recognition.onerror = () => {
        setIsListening(false);
        setVoiceStatus("Could not capture a voice command (microphone permission or embed restriction).");
      };
      recognition.start();
    } catch (err) {
      setIsListening(false);
      setVoiceStatus("Voice recognition is blocked in this embed — open the file in a browser tab.");
    }
  };

  /* ---- weather refresh (optional live key, simulation otherwise) ---- */
  const fetchLiveNagalandWeather = async () => {
    if (!openWeatherKey.trim()) {
      setTourismSpots(prev => prev.map((spot, i) => ({
        ...spot,
        weather: {
          ...spot.weather,
          temp: spot.weather.temp + (i % 2 === 0 ? 1 : -1)

      setWeatherSyncStatus("Updated " + new Date().toLocaleTimeString() + " · Nagaland telemetry replay");
      return;
    }
    try {
      setWeatherSyncStatus("Fetching live OpenWeather API…");
      const updated = await Promise.all(tourismSpots.map(async spot => {
        const res = await fetch("https://api.openweathermap.org/data/2.5/weather?lat=" + spot.coords[0] + "&lon=" + spot.coords[1] + "&units=metric&appid=" + encodeURIComponent(openWeatherKey.trim()));
        if (!res.ok) throw new Error("API error");
        const data = await res.json();
        return {
          ...spot,
          weather: {
            ...spot.weather,
            temp: Math.round(data.main.temp),
            condition: data.weather[0].main
          }
        };
      }));
      setTourismSpots(updated);

      setWeatherSyncStatus("OpenWeather key invalid / no network — using cached Nagaland weather");

      email: email.trim() || "explorer@nagaconnect.co",
      mobile: mobile.trim() || "+91-87940-00123",

      ilpPermitNo: ilpNumber,
      userType: "1st Login (ILP Verified)"

    setUser(newUserObj);
    storageSet("nagaconnect_user", newUserObj);
    openDashboard();
  };

  /* ---- fare + distance estimator ---- */
  const routeMetrics = useMemo(() => {
    const pHub = PICKUP_HUBS.find(h => h.name === pickupPoint) || PICKUP_HUBS[0];
    const dHub = PICKUP_HUBS.find(h => h.name === dropoffPoint) || PICKUP_HUBS[4];
    const R = 6371;
    const dLat = (dHub.coords[0] - pHub.coords[0]) * Math.PI / 180;
    const dLon = (dHub.coords[1] - pHub.coords[1]) * Math.PI / 180;
