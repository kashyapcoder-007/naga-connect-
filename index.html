    /* Traditional Naga Shawl Motif Top Border */

        #0B0F17 12px,

    /* Glassmorphism Utilities */
    .glass-panel {
      background: rgba(21, 28, 40, 0.78);

      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);

    html:not(.dark) .glass-panel {
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid rgba(200, 16, 46, 0.15);
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.08);

    /* Custom Animations */
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 15px rgba(200, 16, 46, 0.4); }
      50% { box-shadow: 0 0 28px rgba(245, 158, 11, 0.7); }
    }
    .animate-glow {
      animation: pulseGlow 3s infinite;
    }

    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    .animate-float {
      animation: floatSlow 4s ease-in-out infinite;
    }

    /* Leaflet Map Container Styling */

      border-radius: 0.75rem;

    // ============================================================================
    const syncToIndexedDB = (storeName, data) => {
      try {
        localStorage.setItem(`nagaconnect_${storeName}`, JSON.stringify(data));
        if ('indexedDB' in window) {
          const req = indexedDB.open('NagaConnectOfflineDB', 1);
          req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains('news')) db.createObjectStore('news', { keyPath: 'id' });
            if (!db.objectStoreNames.contains('bookings')) db.createObjectStore('bookings', { keyPath: 'bookingId' });
          };
          req.onsuccess = (e) => {
            const db = e.target.result;
            if (db.objectStoreNames.contains(storeName)) {
              const tx = db.transaction(storeName, 'readwrite');
              const store = tx.objectStore(storeName);
              if (Array.isArray(data)) {
                data.forEach(item => store.put(item));
              }
            }
          };
        }
      } catch (err) {
        console.warn("Offline cache fallback:", err);
      }
    };

    function InteractiveNagalandMap({ pickup, dropoff, onSelectDropoff }) {
      const mapContainerRef = useRef(null);
      const mapInstanceRef = useRef(null);
      const markersRef = useRef([]);
      const routeLineRef = useRef(null);

      useEffect(() => {
        if (!mapContainerRef.current || mapInstanceRef.current) return;

        const map = L.map(mapContainerRef.current).setView([25.85, 94.15], 8);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution: '&copy; OpenStreetMap contributors | NagaConnect GIS'
        }).addTo(map);

        mapInstanceRef.current = map;

        return () => {
          map.remove();
          mapInstanceRef.current = null;
        };
      }, []);

      useEffect(() => {
        const map = mapInstanceRef.current;
        if (!map) return;

        markersRef.current.forEach(m => m.remove());
        markersRef.current = [];
        if (routeLineRef.current) {
          routeLineRef.current.remove();
          routeLineRef.current = null;
        }

        const pHub = PICKUP_HUBS.find(h => h.name === pickup) || PICKUP_HUBS[0];
        const dHub = PICKUP_HUBS.find(h => h.name === dropoff) || PICKUP_HUBS[4];

        const pickupMarker = L.marker(pHub.coords)
          .addTo(map)
          .bindPopup(`<b>Rider Pickup:</b><br/>${pHub.name}`);

        const dropoffMarker = L.marker(dHub.coords)
          .addTo(map)
          .bindPopup(`<b>Destination:</b><br/>${dHub.name}`)
          .openPopup();

        markersRef.current.push(pickupMarker, dropoffMarker);

        const line = L.polyline([pHub.coords, dHub.coords], {
          color: '#C8102E',
          weight: 4,
          dashArray: '8, 8'
        }).addTo(map);
        routeLineRef.current = line;

        map.fitBounds(L.latLngBounds([pHub.coords, dHub.coords]), { padding: [35, 35] });
      }, [pickup, dropoff]);

      return (
        <div className="relative">
          <div ref={mapContainerRef} className="w-full h-64 md:h-80 rounded-xl border border-slate-300 dark:border-slate-700 shadow-inner" />
          <div className="mt-2 flex flex-wrap items-center justify-between text-xs text-slate-500 dark:text-slate-400">
            <span><i className="fa-solid fa-location-dot text-nagaRed mr-1"></i> Live Nagaland GIS Route Visualizer</span>
            <span>Select any hub below to snap route</span>
          </div>
        </div>
      );
    }

        const a =

            Math.cos((dHub.coords[0] * Math.PI) / 180) *
            Math.sin(dLon / 2) *
            Math.sin(dLon / 2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

                      </div>
                    ))}
                </div>
              </div>
            )}

            {/* --------------------------------------------------------------- */}
            {/* MODULE D: TOURISM PLACES & INTERCONNECTED TRANSPORT (10 SPOTS)  */}
            {/* --------------------------------------------------------------- */}
            {currentView === 'tourism' && (
              <div className="space-y-6">
                {/* Top Header, Search, Tribe Filter & OpenWeather API Bar */}
                <div className="glass-panel rounded-2xl p-6 space-y-4">
                  <div className="flex flex-wrap items-center justify-between gap-4">
                    <div>
                      <span className="text-xs font-bold uppercase text-emerald-400">
                        Module 3 • Interconnected Tourism & Transport Hub
                      </span>
                      <h2 className="font-display font-bold text-2xl md:text-3xl">
                        10 Local Nagaland Tourism Spots, Tribes & Homestays
                      </h2>
                    </div>

                    {/* Optional Live OpenWeather Key Input */}
                    <div className="flex flex-wrap items-center gap-2">
                      <input
                        type="text"
                        placeholder="Optional OpenWeather API Key..."
                        value={openWeatherKey}
                        onChange={(e) => setOpenWeatherKey(e.target.value)}
                        className="px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-xs"
                      />
                      <button
                        onClick={fetchLiveNagalandWeather}
                        className="px-3.5 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold transition"
                      >
                        <i className="fa-solid fa-cloud-Showers-heavy mr-1"></i>Refresh Live Weather
                      </button>
                    </div>
                  </div>

                  <div className="flex flex-wrap items-center justify-between gap-3 pt-2 border-t border-slate-200 dark:border-slate-800">
                    <div className="flex flex-wrap items-center gap-2">
                      <input
                        type="text"
                        placeholder="Search spot, tribe, or district..."
                        value={searchSpot}
                        onChange={(e) => setSearchSpot(e.target.value)}
                        className="px-3.5 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-xs w-60"
                      />
                      {['All', 'Angami', 'Ao', 'Konyak', 'Lotha', 'Sumi'].map((tr) => (
                        <button
                          key={tr}
                          onClick={() => setTribeFilter(tr)}
                          className={`px-3 py-1.5 rounded-xl text-xs font-bold transition ${
                            tribeFilter === tr ? 'bg-nagaRed text-white' : 'bg-slate-200 dark:bg-slate-800'
                          }`}
                        >
                          {tr}
                        </button>
                      ))}
                    </div>
                    <span className="text-xs text-slate-400">
                      <i className="fa-solid fa-satellite-dish text-emerald-400 mr-1"></i>{weatherSyncStatus}
                    </span>
                  </div>
                </div>

                {/* 10 Tourism Cards Grid */}
                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  {tourismSpots
                    .filter(sp => {
                      const matchesTribe = tribeFilter === 'All' || sp.tribe.toLowerCase().includes(tribeFilter.toLowerCase());
                      const matchesSearch =
                        sp.name.toLowerCase().includes(searchSpot.toLowerCase()) ||
                        sp.tribe.toLowerCase().includes(searchSpot.toLowerCase()) ||
                        sp.district.toLowerCase().includes(searchSpot.toLowerCase());
                      return matchesTribe && matchesSearch;
                    })
                    .map((spot) => (
                      <div key={spot.id} className="glass-panel rounded-2xl overflow-hidden flex flex-col justify-between border border-slate-300 dark:border-slate-800 hover:border-nagaRed transition">
                        <div>
                          {/* Spot Image & Weather Overlay */}
                          <div className="relative h-48 overflow-hidden">
                            <img src={spot.image} alt={spot.name} className="w-full h-full object-cover" />
                            <div className="absolute inset-0 bg-gradient-to-t from-nagaDark via-transparent to-transparent"></div>

                            {/* Live Weather Report Badge */}
                            <div className="absolute top-3 right-3 px-3 py-1.5 rounded-xl bg-nagaDark/85 backdrop-blur-md text-white text-xs font-bold flex items-center gap-2 border border-white/15">
                              <i className={`fa-solid ${spot.weather.icon} text-amber-400`}></i>
                              <span>{spot.weather.temp}°C • {spot.weather.condition}</span>
                            </div>

                            {/* Transport Availability Status Badge */}
                            <div className={`absolute top-3 left-3 px-3 py-1 rounded-full text-[11px] font-bold ${
                              spot.transportAvailable
                                ? 'bg-emerald-600/90 text-white'
                                : 'bg-amber-500/95 text-slate-950'
                            }`}>
                              {spot.transportAvailable ? '● Transport Available' : '▲ Limited / Basecamp Drop'}
                            </div>

                            <div className="absolute bottom-3 left-4 right-4 flex items-end justify-between">
                              <div>
                                <span className="text-[11px] text-amber-400 font-semibold">{spot.district}</span>
                                <h3 className="font-display font-bold text-xl text-white">{spot.name}</h3>
                              </div>
                              <button
                                onClick={() => speakText(`${spot.phonetic}. Indigenous territory of the ${spot.tribePhonetic}.`)}
                                title="Hear Authentic Pronunciation"
                                className="p-2 rounded-xl bg-white/15 hover:bg-nagaRed text-white text-xs backdrop-blur-md transition"
                              >
                                <i className="fa-solid fa-volume-high mr-1"></i>Pronounce
                              </button>
                            </div>
                          </div>

                          {/* Card Body: 1. Local Tribe, 2. Homestay/B&B, 3. Weather Advisory, 4. Transport Availability */}
                          <div className="p-5 space-y-3 text-xs">
                            <p className="text-slate-600 dark:text-slate-300 leading-relaxed">
                              {spot.description}
                            </p>

                            {/* 1. Local Tribe Name */}
                            <div className="p-3 rounded-xl bg-nagaRed/10 border border-nagaRed/25 flex items-center justify-between">
                              <div>
                                <span className="text-[10px] uppercase font-bold text-nagaRed block">1. Indigenous Local Tribe</span>
                                <span className="font-bold text-sm">{spot.tribe}</span>
                              </div>
                              <button
                                onClick={() => speakText(spot.tribePhonetic)}
                                className="text-xs text-nagaRed hover:underline font-semibold"
                              >
                                <i className="fa-solid fa-ear-listen mr-1"></i>Hear Tribe Name
                              </button>
                            </div>

                            {/* 2. Bed & Breakfast / Homestay Details */}
                            <div className="p-3 rounded-xl bg-slate-100 dark:bg-slate-800/80 space-y-1">
                              <span className="text-[10px] uppercase font-bold text-amber-500 block">
                                2. Verified Bed & Breakfast / Homestay
                              </span>
                              <div className="font-bold text-sm">{spot.homestay.name}</div>
                              <div className="text-slate-500 dark:text-slate-400">📍 {spot.homestay.address}</div>
                              <div className="flex flex-wrap justify-between pt-1 font-semibold text-emerald-400">
                                <span>📞 {spot.homestay.phone}</span>
                                <span>{spot.homestay.tariff}</span>
                              </div>
                            </div>

                            {/* 3. Live Weather & 4. Transport Availability Metadata */}
                            <div className="flex flex-wrap items-center justify-between gap-2 text-[11px] text-slate-500 dark:text-slate-400 pt-1">
                              <span><i className="fa-solid fa-shield-halved text-amber-400 mr-1"></i>Advisory: <b>{spot.weather.advisory}</b></span>
                              <span><i className="fa-solid fa-calendar-day text-nagaRed mr-1"></i>{spot.availabilityMeta}</span>
                            </div>
                          </div>
                        </div>

                        {/* Interconnected 1-Click Action Button Jumping Back to Booking Hub */}
                        <div className="px-5 pb-5">
                          <button
                            onClick={() => handleJumpFromTourismToBooking(spot)}
                            className="w-full py-3 rounded-xl bg-nagaRed hover:bg-red-700 text-white font-bold text-xs md:text-sm flex items-center justify-center gap-2 shadow-lg transition"
                          >
                            <i className="fa-solid fa-taxi"></i>
                            {spot.transportAvailable
                              ? `Book Transport to ${spot.name} Now (Pre-Filled)`
                              : `Pre-Book Basecamp 4W Cab to ${spot.name}`}
                          </button>
                        </div>
                      </div>
                    ))}
                </div>
              </div>
            )}
          </main>

          {/* ================================================================= */}
          {/* FOOTER WITH NAGALAND UNIVERSITY KOHIMA CAMPUS METADATA & WEATHER  */}
          {/* ================================================================= */}
          <footer className="glass-panel mt-12 border-t border-slate-300 dark:border-slate-800">
            <div className="max-w-7xl mx-auto px-6 py-8 grid grid-cols-1 md:grid-cols-12 gap-8 items-center">
              {/* Brand & Kohima Campus Address */}
              <div className="md:col-span-5 space-y-2">
                <div className="font-display font-extrabold text-xl">
                  NAGA<span className="text-nagaRed">CONNECT</span>
                </div>
                <p className="text-xs font-semibold text-amber-500">{t.relaxingJourney}</p>
                <p className="text-xs text-slate-500 dark:text-slate-400">
                  📍 Nagaland University, Kohima Campus, Meriema — 797004, Nagaland, India
                </p>
                <div className="text-xs text-slate-500 dark:text-slate-400 space-y-0.5 pt-1">
                  <div>📞 Phone: +91-87947-95051 / 1487797975051</div>
                  <div>✉️ Email: nagaconnect.kohima@gmail.com</div>
                  <div>🌐 Website: www.nagaconnect.co</div>
                </div>
              </div>

              {/* Quick Interconnected Links */}
              <div className="md:col-span-4 space-y-2 text-xs">
                <div className="font-bold uppercase tracking-wider text-slate-400">Official Portals & Gateways</div>
                <ul className="space-y-1.5">
                  <li>
                    <a href="https://ilp.nagaland.gov.in" target="_blank" rel="noopener noreferrer" className="hover:text-nagaRed">
                      ↗ Official Nagaland Inner Line Permit (ilp.nagaland.gov.in)
                    </a>
                  </li>
                  <li>
                    <a href="https://www.irctc.co.in" target="_blank" rel="noopener noreferrer" className="hover:text-nagaRed">
                      ↗ Official IRCTC Train Booking Portal (irctc.co.in)
                    </a>
                  </li>
                  <li>
                    <a href="https://www.air.irctc.co.in" target="_blank" rel="noopener noreferrer" className="hover:text-nagaRed">
                      ↗ Official IRCTC Flight Booking Portal (air.irctc.co.in)
                    </a>
                  </li>
                </ul>
              </div>

              {/* Live Weather Forecast Widget (Matching PDF 28°C Mostly Sunny Widget) */}
              <div className="md:col-span-3 p-4 rounded-2xl bg-gradient-to-br from-amber-500/20 to-nagaRed/20 border border-amber-500/30 text-center">
                <div className="flex items-center justify-center gap-3">
                  <i className="fa-solid fa-sun text-3xl text-amber-400"></i>
                  <div className="text-left">
                    <div className="font-display font-extrabold text-2xl">28°C</div>
                    <div className="text-xs font-semibold text-amber-400">Mostly Sunny</div>
                  </div>
                </div>
                <div className="mt-2 pt-2 border-t border-white/10 flex justify-between text-[10px] font-mono text-slate-400">
                  <span>SAT</span><span>SUN</span><span>MON</span><span>TUE</span><span>WED</span><span className="text-amber-400 font-bold">THU</span>
                </div>
              </div>
            </div>
            <div className="naga-shawl-border"></div>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<NagaConnectApp />);

    // Register Service Worker if hosted on HTTP/HTTPS
    if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.hostname === 'localhost')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
